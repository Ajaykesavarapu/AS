kind = "web"
previewPath = "/"
title = "ASKreativ Global Solutions"
version = "1.0.0"
id = "artifacts/askreativ"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18499

[services.development]
run = "pnpm --filter @workspace/askreativ run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/askreativ", "run", "build" ]
publicDir = "artifacts/askreativ/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18499"
BASE_PATH = "/"
